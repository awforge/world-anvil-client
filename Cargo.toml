[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "world-anvil-client"
version = "0.1.0"
edition = "2024"
description = "An unofficial Rust client for the World Anvil API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/awforge/world-anvil-client"
keywords = ["world-anvil", "worldbuilding", "api", "client"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
    "/Cargo.toml",
    "/build.rs",
    "/codegen.rs",
    "/src/**",
    "/tests/**",
    "/openapi/world-anvil.openapi.json",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
progenitor-client = "=0.14.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "query",
    "stream",
    "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.24.1", features = ["serde", "v4"] }

[build-dependencies]
openapiv3 = "=2.2.0"
prettyplease = "0.3.0"
progenitor = { version = "=0.14.0", default-features = false }
serde_json = "1.0.151"
syn = { version = "3.0.3", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt",
    "sync",
    "test-util",
    "time",
] }
